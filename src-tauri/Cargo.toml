[package]
name = "open-dictate"
version = "0.1.0"
description = "Native host for Open Dictate"
authors = ["Open Dictate"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Goprogabriel/Open-Dictate"
publish = false

[lib]
name = "open_dictate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

arboard = "3.6"
aes-gcm = "0.10"
base64 = "0.22"
cpal = "0.17"
enigo = "0.6"
encoding_rs = "0.8"
hound = "3.5"
log = "0.4"
open = "5"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rdev = "0.5"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
whisper-rs = { version = "0.16", features = ["metal"] }
llama-cpp-2 = { version = "0.1.152", default-features = false, features = ["common", "dynamic-link", "metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["libc", "NSRunningApplication", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"
llama-cpp-2 = { version = "0.1.152", default-features = false, features = ["common"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
