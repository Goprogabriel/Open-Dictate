name: Bug report
description: Report a reproducible problem in Open Dictate.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Open Dictate. Never include API keys, account data, or private dictation text.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Browser development preview]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Dictate version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, and private dictated text from this report.
          required: true
