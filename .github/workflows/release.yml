name: Desktop release

on:
  workflow_dispatch:
    inputs:
      production:
        description: Require trusted signing and production configuration
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  OPEN_DICTATE_MANAGED_API_ORIGIN: ${{ vars.OPEN_DICTATE_MANAGED_API_ORIGIN }}
  VITE_ENABLE_PREVIEW_DATA: false
  VITE_ENABLE_FIREBASE_EMULATORS: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run check
      - run: npm run check:functions
      - run: npm run functions:test:rules

  build-macos:
    name: macOS ${{ matrix.architecture }}
    needs: quality
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            architecture: arm64
          - target: x86_64-apple-darwin
            architecture: x64
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Build distributable
        shell: bash
        run: |
          release_args=(--skip-checks --target "${{ matrix.target }}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" || "${{ inputs.production }}" == "true" ]]; then
            release_args+=(--production)
          else
            release_args+=(--public-demo)
          fi
          npm run release:build -- "${release_args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-dictate-macos-${{ matrix.architecture }}
          path: release/artifacts/v*/macos-${{ matrix.architecture }}/*
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: quality
    runs-on: windows-2025
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: ./release/scripts/import-windows-certificate.ps1
      - name: Build distributable
        shell: pwsh
        run: |
          $releaseArgs = @("--skip-checks")
          if ($env:GITHUB_REF_TYPE -eq "tag" -or "${{ inputs.production }}" -eq "true") {
            $releaseArgs += "--production"
          } else {
            $releaseArgs += "--public-demo"
          }
          npm run release:build -- @releaseArgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-dictate-windows-x64
          path: release/artifacts/v*/windows-x64/*
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: open-dictate-*
          path: artifacts
          merge-multiple: false
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f -print | sort)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Open Dictate ${GITHUB_REF_NAME#app-v}" \
            --notes "Signed desktop installers for macOS and Windows. Verify the platform SHA256SUMS files and complete the release smoke-test checklist before publishing." \
            --draft \
            --verify-tag
